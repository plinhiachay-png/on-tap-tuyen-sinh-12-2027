 tick();A.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ex.a[ex.i]=+b.dataset.k;examV()});A.querySelectorAll(".nums button").forEach(b=>b.onclick=()=>{ex.i=+b.dataset.i;examV()});
 $("#pv").onclick=()=>{ex.i=Math.max(0,ex.i-1);examV()};$("#nx").onclick=()=>{ex.i=Math.min(Q.length-1,ex.i+1);examV()};$("#fg").onclick=()=>{ex.f[ex.i]=!ex.f[ex.i];examV()};

 Q.forEach((q,i)=>{if(ex.a[i]!==q.a&&!en.some(e=>e.q===q.q))en.push({q:q.q,c:q.c,ans:q.o[q.a],e:q.e})});sv("errs",en);if(nav()==="exam")examV()}

 <h2>Đáp án và giải thích</h2>${Q.map((q,i)=>`<div class="card" style="margin-bottom:10px"><h3>Câu ${i+1}. ${q.q}</h3>${q.o.map((o,k)=>`<div class="opt ${k===q.a?"ok":ex.a[i]===k?"no":""}" style="padding:8px 12px;border-radius:10px">${"ABCD"[k]}. ${o}</div>`).join("")}<p><b>Lời giải:</b> ${q.e}</p></div>`).join("")}<button id="rt">Làm lại</button>`;$("#rt").onclick=()=>{ex=null;examV()}}
